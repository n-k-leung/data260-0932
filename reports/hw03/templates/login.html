<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FastAPI Homework 3 - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light" style="background-color:#CCCCFF;">
  <div class="container">
    <a class="navbar-brand" href="/">FastAPI Homework 3</a>
    <div class="navbar-nav">
      {% if user %}
        <a class="nav-link" href="/dashboard">Dashboard</a>
        <a class="nav-link" href="/logout">Logout</a>
      {% else %}
        <a class="nav-link active" href="/login">Login</a>
      {% endif %}
    </div>
  </div>
</nav>

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="card-title mb-3">Login</h4>

          <!-- Intentionally no alert shown for invalid login.
               Students can add a Bootstrap Alert as an extra step. -->
          {% if error %}
            <div class="alert alert-danger">
              <strong>Danger!</strong> Invalid user or password. Please login again.
            </div>
          {% endif %}
          <form method="post" action="/login">
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input class="form-control" type="text" name="username" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>
              <input class="form-control" type="password" name="password" required>
            </div>

            <button class="btn btn-purple w-100" type="submit">Login</button>
          </form>

          <div class="text-center mt-3">
            <a href="/" class= "btn btn-purple"> Back to Home</a>
          </div>
          <style>
            .btn-purple{
              background-color:#B39EB5;
              color: white;
              border:none;
            }
            .btn-purple:hover{
              background-color:#805B87;
              color: white;
              border:none;
            }
          </style>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
