<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Soruce Package vulnerability Management - REST API</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body>
    <h1 class="heading">Package Management App - REST API</h1>

    <h2>Packages List</h2>
    <table id="packageTable" class="package-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Package Name</th>
                <th>Severity</th>
            </tr>
        </thead>
        <tbody id="packageTableBody">
            <!-- Packages will be loaded here via JavaScript -->
        </tbody>
    </table>

    <!-- Search Package Section -->
    <div class="actions-container">
        <h3>Search Package</h3>
        <input type="text" id="searchInput" placeholder="Search by package name">
        <button onclick="searchPackage()">Search</button>
    </div>

    <!-- Create Package Section -->
    <div class="actions-container">
        <h3>Create Package</h3>
        <input type="text" id="createName" placeholder="Enter package name">
        <input type="text" id="createSeverity" placeholder="Enter severity">
        <button onclick="createPackage()">Add Package</button>
    </div>

    <!-- Update Package Section -->
    <div class="actions-container">
        <h3>Update Package</h3>
        <input type="number" id="updateId" placeholder="Enter Package ID">
        <input type="text" id="updatePackageName" placeholder="Enter new package name">
        <input type="text" id="updateSeverity" placeholder="Enter severity of the package vulnerability">
        <button onclick="updatePackage()">Update Package</button>
    </div>

    <!-- Delete Package Section -->
    <div class="actions-container">
        <h3>Delete Package</h3>
        <input type="number" id="deleteId" placeholder="Enter Package ID">
        <button onclick="deletePackage()">Delete Package</button>
        <button onclick="deleteHighestPackage()">Delete Package with Highest ID</button>
    </div>

    <script src="/static/js/app.js"></script>
</body>

</html>
